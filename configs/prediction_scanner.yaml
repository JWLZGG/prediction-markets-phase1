loop_interval_seconds: 60
max_cycles: 120
kalshi_max_markets: 3000
simulate_kalshi_fail_once: false

venues:
  polymarket:
    taker_fee_bps: 0
    slippage_buffer_bps: 50
    fixed_buffer: 0.0

  kalshi:
    taker_fee_bps: 25
    slippage_buffer_bps: 50
    fixed_buffer: 0.0

scanner:
  min_edge_bps: 100
  default_target_size: 100

log_path_complement_polymarket: logs/polymarket_complement_runs.jsonl
polymarket_orderbook_limit_markets: 100
polymarket_complement_target_size: 10.0
polymarket_complement_threshold_bps: 10.0